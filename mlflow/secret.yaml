apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secret
  namespace: mlops-mlflow
type: Opaque
stringData:
  DB_PASSWORD: pass
  MLFLOW_S3_IGNORE_TLS: "true"
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadminpassword
  MLFLOW_S3_ENDPOINT_URL: http://minio.mlops-s3.svc.cluster.local:9000
  MLFLOW_S3_BUCKET: bucket
